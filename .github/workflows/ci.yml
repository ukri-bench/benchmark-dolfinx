name: Benchmark build and run

# Builds the benchmark for CPU, CUDA and ROCm in Ubuntu 26.04 containers and
# runs the CPU build.
#
# Dependencies are installed with Spack using the same setup as
# ukri-bench/spack-packages, so they come from its build cache. Keep
# .github/spack/versions.env and .github/spack/ci-env.yaml the same as in that
# repository, or the dependency hashes change and are rebuilt.
#
# GitHub-hosted runners have no GPUs, so the GPU builds only compile: they need
# the CUDA/ROCm compilers but no drivers, and build against the same (CPU)
# dependencies as the CPU build.

on:
  pull_request:
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read # pull from the shared build cache

env:
  # Credentials for the build cache
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.device }})
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cpu
            cmake_opt: ""
          - device: cuda
            cmake_opt: -DCUDA_ARCH=75 -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.5/bin/nvcc
          - device: rocm
            cmake_opt: >-
              -DHIP_ARCH=gfx90a
              -DCMAKE_HIP_COMPILER=/opt/rocm/core-10.2/lib/llvm/bin/clang++
              -DCMAKE_PREFIX_PATH=/opt/rocm/core-10.2
    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe

    steps:
      - name: Install Spack requirements
        run: |
          apt-get -y update
          apt-get install -y --no-install-recommends file bzip2 ca-certificates curl g++ gcc gfortran git gzip \
            lsb-release patch python3 python3-numpy tar unzip xz-utils zstd

      - if: matrix.device == 'cuda'
        name: Install CUDA compiler
        run: |
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          dpkg -i cuda-keyring_1.1-1_all.deb
          apt-get -y update
          apt-get install -y --no-install-recommends cuda-nvcc-13-5

      - if: matrix.device == 'rocm'
        name: Install ROCm compiler and rocThrust
        run: |
          mkdir -p /etc/apt/keyrings
          curl -fsSL -o /etc/apt/keyrings/amdrocm.asc https://stable.repo.amd.com/rocm/gpg/packages.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/amdrocm.asc] https://stable.repo.amd.com/rocm/core/packages/ubuntu2604 stable main" \
            > /etc/apt/sources.list.d/rocm.list
          apt-get -y update
          apt-get install -y --no-install-recommends amdrocm-ccl-dev10.2

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Spack
        uses: ./.github/actions/setup-spack

      - name: Create Spack environment
        run: |
          spack repo add --name ukri_bench https://github.com/ukri-bench/spack-packages.git
          spack env create ci .github/spack/ci-env.yaml
          spack -e ci add bench-dolfinx
          spack -e ci concretize -j "$(nproc)"

      - name: Install dependencies
        run: |
          spack -e ci install -j "$(nproc)" --only dependencies --use-buildcache auto
          # --only dependencies skips build-only dependencies (CMake, FFCx) of
          # the benchmark itself, which are needed to build it
          build_deps=$(spack -e ci python -c 'import spack.environment as ev; print(" ".join("/" + d.dag_hash() for r in ev.active_environment().concrete_roots() for d in r.dependencies(deptype="build")))')
          if [ -n "${build_deps}" ]; then
            # shellcheck disable=SC2086
            spack -e ci install -j "$(nproc)" --no-add --use-buildcache auto ${build_deps}
          fi
          spack -e ci build-env --dump build_env.sh bench-dolfinx

      - name: Build benchmark
        run: |
          source ./build_env.sh
          cmake ${{ matrix.cmake_opt }} -B build -S src/
          cmake --build build --parallel "$(nproc)"

      - if: matrix.device == 'cpu'
        name: Run benchmark
        run: |
          source ./build_env.sh
          build/bench_dolfinx --ndofs=1000 --degree=3 --qmode=0 --nreps=1 --mat_comp --float=64 --json a.json
          mpirun -n 2 build/bench_dolfinx --ndofs=500 --degree=3 --qmode=0 --nreps=1 --mat_comp --float=64 --json b.json

      - if: matrix.device == 'cpu'
        name: Check output
        run: |
          python3 src/test_output.py a.json
          python3 src/test_output.py b.json
